apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: kube-system
spec:
  interval: 24h0m0s
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: sealed-secrets
      version: "2.20.0"
      sourceRef:
        kind: HelmRepository
        name: sealed-secrets
        namespace: flux-system
      interval: 24h0m0s
  values:
    fullnameOverride: sealed-secrets-controller
    image:
      registry: ghcr.io
    metrics:
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
        groups:
          - name: sealed-secrets-controller.rules
            rules:
              - alert: SealedSecretNotSynced
                expr: |-
                  sealed_secrets_controller_condition_info{condition="Synced"} != 1
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: SealedSecret {{ $labels.namespace }}/{{ $labels.name }} is not Synced
                  description: The controller could not unseal {{ $labels.namespace }}/{{ $labels.name }} (value {{ $value }}; -1 is false, 0 is unknown). The app that uses the Secret will not get its config. Check the controller logs.
              - alert: SealedSecretsMetricsMissing
                expr: |-
                  absent(sealed_secrets_controller_condition_info)
                for: 30m
                labels:
                  severity: warning
                annotations:
                  summary: Sealed Secrets metrics are missing
                  description: No SealedSecret condition metrics for 30 minutes, so unseal failures cannot be detected. Check the ServiceMonitor and the controller pod.
