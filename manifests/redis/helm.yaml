---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: redis
spec:
  interval: 24h0m0s
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: valkey
      version: "0.12.1"
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
      interval: 24h0m0s
  values:
    fullnameOverride: redis-master
    deploymentStrategy: Recreate
    auth:
      enabled: true
      usersExistingSecret: redis
      aclUsers:
        default:
          permissions: "~* &* +@all -flushall -flushdb"
          passwordKey: redis-password
