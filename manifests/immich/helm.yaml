apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 24h0m0s
  timeout: 5m0s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: immich
      version: "0.13.4"
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 24h0m0s
  valuesFrom:
    - kind: Secret
      name: immich-values
  postRenderers:
    - kustomize:
        images:
          - name: ghcr.io/immich-app/immich-server
            newTag: v3.3.5 # {"$imagepolicy": "immich:immich:tag"}
            digest: sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6 # {"$imagepolicy": "immich:immich:digest"}
  values:
    controllers:
      main:
        containers:
          main:
            image:
              tag: v3.3.5 # {"$imagepolicy": "immich:immich:tag"}
            env:
              REDIS_HOSTNAME: redis-master.redis.svc
    immich:
      metrics:
        enabled: true
      persistence:
        library:
          existingClaim: library
    server:
      enabled: true
      controllers:
        main:
          pod:
            annotations:
              backup.velero.io/backup-volumes: library
            securityContext:
              runAsUser: 10001
              runAsGroup: 10001
              fsGroup: 10001
              fsGroupChangePolicy: Always
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-server
                pullPolicy: IfNotPresent
      ingress:
        main:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
          hosts:
            - host: photos.seymour.family
              paths:
                - path: "/"
          tls:
            - hosts:
                - photos.seymour.family
              secretName: immich-tls
    machine-learning:
      enabled: true
      controllers:
        main:
          pod:
            securityContext:
              runAsUser: 10001
              runAsGroup: 10001
              fsGroup: 10001
              fsGroupChangePolicy: Always
          containers:
            main:
              image:
                repository: ghcr.io/immich-app/immich-machine-learning
                pullPolicy: IfNotPresent
      persistence:
        cache:
          enabled: true
          type: emptyDir
