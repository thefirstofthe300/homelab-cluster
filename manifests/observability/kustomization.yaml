apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability-system
resources:
  - helm.yaml
  - namespace.yaml
  - sealedsecret.yaml
  - prometheusrule-oom.yaml
configMapGenerator:
  - name: grafana-dashboard-synapse
    files:
      - dashboards/synapse.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
