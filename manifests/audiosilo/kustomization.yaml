apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: audiosilo
resources:
  - namespace.yaml
  - storage.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: audiosilo
images:
  - name: ghcr.io/kodestar/audiosilo-server
    newTag: "2.6.0"
