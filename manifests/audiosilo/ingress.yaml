apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiosilo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  rules:
    - host: books.seymour.family
      http:
        paths:
          - backend:
              service:
                name: audiosilo
                port:
                  name: http
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - books.seymour.family
      secretName: audiosilo-tls
