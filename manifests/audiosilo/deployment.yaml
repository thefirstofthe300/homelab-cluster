---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiosilo
  namespace: audiosilo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audiosilo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiosilo
    spec:
      containers:
        - name: audiosilo
          image: ghcr.io/kodestar/audiosilo-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: audiosilo
          volumeMounts:
            - name: data
              mountPath: /data
            - name: media
              mountPath: /library
              subPath: audiobooks
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/server
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/server
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/server
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
        - name: media
          persistentVolumeClaim:
            claimName: media
