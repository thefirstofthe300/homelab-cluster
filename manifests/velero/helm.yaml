apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 24h0m0s
  install:
    remediation:
      retries: 1
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 1
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: velero
      version: "12.2.2"
      sourceRef:
        kind: HelmRepository
        name: vmware
        namespace: flux-system
      interval: 24h0m0s
  values:
    kubectl:
      image:
        repository: jfcoz/kubectl-deb12-basic
    image:
      repository: velero/velero
      tag: v1.18.4
      pullPolicy: IfNotPresent
    resources: {}
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    metrics:
      enabled: true
      serviceMonitor:
        autodetect: true
        enabled: true
      nodeAgentPodMonitor:
        autodetect: true
        enabled: true
      prometheusRule:
        autodetect: true
        enabled: true
        additionalLabels: {}
        spec:
          - alert: VeleroBackupFailed
            annotations:
              summary: Velero backup schedule {{ $labels.schedule }} failed
              description: The most recent backup of schedule {{ $labels.schedule }} did not complete. Check `kubectl get backup -n velero` for the failureReason.
            expr: |-
              min by (schedule) (velero_backup_last_status{schedule!=""}) == 0
            for: 10m
            labels:
              severity: critical
          - alert: VeleroBackupStale
            annotations:
              summary: No successful Velero backup of {{ $labels.schedule }} in 36 hours
              description: Schedule {{ $labels.schedule }} last succeeded {{ $value | humanizeDuration }} ago.
            expr: |-
              time() - max by (schedule) (velero_backup_last_successful_timestamp{schedule!=""}) > 129600
            for: 10m
            labels:
              severity: critical
          - alert: VeleroNoBackupAttempts
            annotations:
              summary: Velero schedule {{ $labels.schedule }} has not run in 36 hours
              description: No backup was attempted for schedule {{ $labels.schedule }}. Check the Schedule and the Velero server.
            expr: |-
              sum by (schedule) (increase(velero_backup_attempt_total{schedule!=""}[36h])) == 0
            for: 1h
            labels:
              severity: critical
          - alert: VeleroBackupPartialFailure
            annotations:
              summary: Velero backup schedule {{ $labels.schedule }} partially failed
              description: A backup of schedule {{ $labels.schedule }} completed with errors in the last 24 hours.
            expr: |-
              sum by (schedule) (increase(velero_backup_partial_failure_total{schedule!=""}[24h])) > 0
            for: 10m
            labels:
              severity: warning
          - alert: VeleroBackupStorageLocationUnavailable
            annotations:
              summary: Velero backup storage location is unavailable
              description: Velero cannot reach its backup storage location.
            expr: |-
              min(velero_backup_location_status_gauge) == 0
            for: 10m
            labels:
              severity: critical
          - alert: VeleroRepoMaintenanceFailed
            annotations:
              summary: Velero repository maintenance failed
              description: A kopia repository maintenance job failed in the last 24 hours.
            expr: |-
              sum(increase(velero_repo_maintenance_failure_total[24h])) > 0
            for: 10m
            labels:
              severity: warning

    snapshotsEnabled: false

    configuration:
      backupStorageLocation:
        - name: backups
          provider: aws
          bucket: seymour-family-backup
          default: true
          credential:
            name: cloud-provider-credentials
            key: credentials
          config:
            region: us-west-004
            s3Url: https://s3.us-west-004.backblazeb2.com
            checksumAlgorithm: ""

    credentials:
      useSecret: true
      existingSecret: cloud-provider-credentials

    backupsEnabled: true
    deployNodeAgent: true
    nodeAgent:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    schedules: {}
