apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux
  namespace: flux-system
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxResourceNotReady
          annotations:
            summary: Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready (state: {{ $labels.ready }}) for 30 minutes. Check `flux get all -A` and the resource's status conditions."
          expr: |-
            gotk_resource_info{ready!="True", suspended!="true"} == 1
          for: 30m
          labels:
            severity: warning
        - alert: FluxResourceSuspended
          annotations:
            summary: Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is suspended
            description: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for 24 hours and is not being reconciled."
          expr: |-
            gotk_resource_info{suspended="true"} == 1
          for: 24h
          labels:
            severity: warning
        - alert: FluxMetricsMissing
          annotations:
            summary: Flux resource metrics are missing
            description: No gotk_resource_info series for HelmRelease objects. kube-state-metrics custom resource state may be misconfigured, so the Flux alerts cannot fire.
          expr: |-
            absent(gotk_resource_info{customresource_kind="HelmRelease"})
          for: 30m
          labels:
            severity: warning
