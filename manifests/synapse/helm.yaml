apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix
spec:
  interval: 24h0m0s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: matrix-stack
      version: "26.11.3"
      sourceRef:
        kind: HelmRepository
        name: ess-community
        namespace: flux-system
      interval: 24h0m0s
  values:
    wellKnownDelegation:
      baseDomainRedirect:
        enabled: true
    certManager:
      clusterIssuer: letsencrypt-production
    elementAdmin:
      ingress:
        host: admin.synapse.seymour.family
    elementWeb:
      ingress:
        host: chat.seymour.family
    matrixAuthenticationService:
      additional:
        upstream-oauth.yml:
          configSecret: mas-upstream-oauth
          configSecretKey: upstream-oauth2.yaml
        password-scheme.yml:
          config: |
            passwords:
              enabled: false
              schemes:
                - version: 1
                  algorithm: bcrypt
                  unicode_normalization: true
                - version: 2
                  algorithm: argon2id
      ingress:
        host: mas.seymour.family
      postgres:
        host: 192.168.1.204
        port: 5432
        user: mas
        password:
          secret: synapse-postgres-user-mas
          secretKey: password
        database: mas
        sslMode: prefer
    matrixRTC:
      ingress:
        host: mrtc.seymour.family
    serverName: seymour.family
    synapse:
      additional:
        100-room-config.yml:
          config: |
            experimental_features:
              msc4190_device_management: true
            forget_rooms_on_leave: true
            forgotten_room_retention_period: 1d
            dynamic_thumbnails: true
      ingress:
        host: matrix.seymour.family
      appservices:
        - secret: appservice-registrations
          secretKey: mautrix-signal.yaml
        - secret: appservice-registrations
          secretKey: mautrix-gmessages.yaml
        - secret: appservice-registrations
          secretKey: mautrix-discord.yaml
        - secret: appservice-registrations
          secretKey: doublepuppet.yaml
      workers:
        appservice:
          enabled: true
        federation-reader:
          enabled: true
        federation-inbound:
          enabled: true
        synchrotron:
          enabled: true
        sliding-sync:
          enabled: true
      signingKey:
        secret: matrix-synapse-signingkey
        secretKey: signing.key
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 991
        runAsGroup: 991
      media:
        storage:
          existingClaim: media
      postgres:
        host: 192.168.1.204
        port: 5432
        user: synapse
        password:
          secret: synapse-postgres-user-synapse
          secretKey: password
        database: synapse
        sslMode: prefer
