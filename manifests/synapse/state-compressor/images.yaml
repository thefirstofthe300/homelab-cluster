---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: state-compressor
spec:
  image: ghcr.io/thefirstofthe300/rust-synapse-compress-state
  interval: 24h0m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: state-compressor
spec:
  digestReflectionPolicy: Always
  interval: 24h0m0s
  imageRepositoryRef:
    name: state-compressor
  policy:
    semver:
      range: v0.x.x
