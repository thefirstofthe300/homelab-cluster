---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: state-compressor
  labels:
    app.kubernetes.io/component: state-compressor
spec:
  schedule: "0 0 * * 0"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: compressor
              image: ghcr.io/thefirstofthe300/rust-synapse-compress-state
              command:
                - synapse_auto_compressor
              args:
                - -p
                - "user=synapse password=$(DB_PASSWORD) dbname=synapse host=192.168.1.204"
                - -c
                - "500"
                - -n
                - "10000"
              env:
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-synapse
                      key: password
          restartPolicy: OnFailure
