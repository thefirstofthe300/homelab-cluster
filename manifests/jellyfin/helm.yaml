apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h0m0s
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: jellyfin
      version: "3.7.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
      interval: 24h0m0s
  postRenderers:
    - kustomize:
        images:
          - name: docker.io/jellyfin/jellyfin
            newTag: "12.4" # {"$imagepolicy": "jellyfin:jellyfin:tag"}
            digest: sha256:fea863d0cd9ec445985d9c75fc6ed64e38a1d2766cf0c250a33d553f4fc1b771 # {"$imagepolicy": "jellyfin:jellyfin:digest"}
  values:
    image:
      tag: "12.4" # {"$imagepolicy": "jellyfin:jellyfin:tag"}
    jellyfin:
      env:
        - name: TZ
          value: America/Los_Angeles
    deploymentStrategy:
      type: Recreate
    securityContext:
      runAsGroup: 568
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: movies.seymour.family
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls:
        - hosts:
            - movies.seymour.family
          secretName: jellyfin-tls
    resources:
      requests:
        cpu: 150m
        memory: 1Gi
      limits:
        gpu.intel.com/i915: 1000m
    persistence:
      config:
        enabled: true
        storageClass: truenas-iscsi-csi
      media:
        enabled: true
        existingClaim: media
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
